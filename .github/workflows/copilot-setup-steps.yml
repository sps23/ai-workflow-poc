name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .gitattributes
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .gitattributes

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository with PDF resources
        uses: actions/checkout@v5
        with:
          lfs: true
